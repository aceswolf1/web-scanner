services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3001:3000"
    volumes:
      - ./frontend:/app
      - frontend_nm:/app/node_modules
      - frontend_nuxt:/app/.nuxt
    environment:
      - NUXT_PUBLIC_API_URL=${NUXT_PUBLIC_API_URL}
      - NUXT_PUBLIC_STORAGE_URL=${NUXT_PUBLIC_STORAGE_URL}
      - API_INTERNAL_URL=http://api:4000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - web-scanner
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    ports:
      - "4000:4000"
    volumes:
      - ./api:/app
      - api_nm:/app/node_modules
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_PORT=${MINIO_PORT}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET}
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL:-http://localhost:9000}
      - MINIO_USE_SSL=false
      - EBAY_APP_ID=${EBAY_APP_ID:-}
      - EBAY_CERTID=${EBAY_CERTID:-}
      - EBAY_DEVID=${EBAY_DEVID:-}
      - EBAY_ENV=${EBAY_ENV:-production}
      - ML_APP_ID=${ML_APP_ID:-}
      - ML_CLIENT_SECRET=${ML_CLIENT_SECRET:-}
      - ML_SITE_ID=${ML_SITE_ID:-MCO}
      - ML_ACCESS_TOKEN=${ML_ACCESS_TOKEN:-}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - PORT=4000
      - NODE_ENV=development
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - web-scanner
    restart: unless-stopped

  scraper:
    build:
      context: ./scraper
      dockerfile: Dockerfile
    environment:
      - API_INTERNAL_URL=http://api:4000
      - SCRAPE_INTERVAL_HOURS=8
      - NODE_ENV=development
    depends_on:
      api:
        condition: service_healthy
    networks:
      - web-scanner
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - web-scanner
    restart: unless-stopped

  storage:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - web-scanner
    restart: unless-stopped

  storage-init:
    image: minio/mc:latest
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set minio http://storage:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing minio/$$MINIO_BUCKET &&
      mc anonymous set download minio/$$MINIO_BUCKET &&
      echo 'MinIO bucket ready' &&
      exit 0
      "
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_BUCKET=${MINIO_BUCKET}
    networks:
      - web-scanner

volumes:
  postgres_data:
  minio_data:
  frontend_nm:
  frontend_nuxt:
  api_nm:

networks:
  web-scanner:
    driver: bridge