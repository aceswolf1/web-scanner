name: Build and publish images

# Publishes multi-arch (amd64 + arm64) images to GHCR on every release tag.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Each release pushes THREE tags per image so Watchtower on the NAS (which
# watches the fixed `:latest` tag) picks up the new digest automatically:
#   - web-scanner-api:0.1.0   (exact version)
#   - web-scanner-api:0.1     (major.minor, moving)
#   - web-scanner-api:latest  (moving — what the NAS/Watchtower tracks)
#
# Uses the built-in GITHUB_TOKEN — no secrets to configure.

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io

jobs:
  # Gate publishing on static checks. (The frontend is fully built inside its
  # Docker image, so a broken Nuxt build also fails the publish job.)
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Typecheck API
        working-directory: api
        run: |
          pnpm install --frozen-lockfile
          pnpm db:generate
          pnpm exec tsc --noEmit

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Byte-compile scraper
        run: python -m compileall -q scraper

  build-and-push:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each service is self-contained — context is its own directory.
          - service: api
            context: ./api
            image: web-scanner-api
          - service: frontend
            context: ./frontend
            image: web-scanner-frontend
          - service: scraper
            context: ./scraper
            image: web-scanner-scraper
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR image paths must be lowercase; the owner login may contain capitals.
      - name: Compute lowercase owner
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push (${{ matrix.service }})
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Per-service cache scope so the three matrix jobs don't evict each other.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
